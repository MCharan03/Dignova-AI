<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dignova AI | Sentient Dossier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00d4ff;
            --bg: #050505;
            --sidebar: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.03);
        }
        body {
            background-color: var(--bg);
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* NotebookLLM Enhanced Styling */
        .sidebar { background-color: var(--sidebar); border-right: 1px solid rgba(255,255,255,0.05); }
        .glass-card { background: var(--glass); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.06); }
        
        /* Unfolding Tree Logic */
        .tree-node { transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .tree-children { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s; 
            opacity: 0;
            padding-left: 1.5rem;
            border-left: 1px border-white/5;
        }
        .tree-node.open > .tree-children { max-height: 1000px; opacity: 1; margin-top: 0.5rem; }
        
        .node-label { 
            cursor: pointer; 
            padding: 0.75rem 1rem; 
            border-radius: 12px; 
            display: flex; 
            align-items: center; 
            gap: 0.75rem;
            transition: all 0.2s;
            position: relative;
        }
        .node-label:hover { background: rgba(255,255,255,0.03); }
        .node-label.active { background: rgba(0, 212, 255, 0.08); color: var(--accent); }
        .node-label.active::before {
            content: ''; position: absolute; left: 0; top: 20%; bottom: 20%; width: 2px; background: var(--accent);
        }

        /* Connecting Lines */
        .line {
            position: absolute; left: -1rem; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,0.05);
        }
        
        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-content { animation: fadeInScale 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }

        .progress-bar { transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
    </style>
</head>
<body class="h-screen w-screen flex">

    <!-- NAVIGATION SIDEBAR (The Unfolding Tree) -->
    <aside class="sidebar w-80 h-full flex flex-col z-20">
        <div class="p-8 border-b border-white/5">
            <div class="flex items-center gap-3 mb-1">
                <i data-lucide="brain" class="text-accent w-6 h-6"></i>
                <h1 class="text-lg font-black tracking-tighter uppercase">Dignova Intelligence</h1>
            </div>
            <p class="text-[9px] mono text-white/30 tracking-[0.3em] uppercase">Sentient Dossier_v1</p>
        </div>

        <nav class="flex-1 overflow-y-auto p-4 custom-scrollbar" id="tree-root">
            <!-- Root: Dignova-AI -->
            <div class="tree-node open" id="node-root">
                <div class="node-label active" onclick="jumpTo(0)">
                    <i data-lucide="network" class="w-4 h-4"></i>
                    <span class="text-xs font-bold uppercase tracking-wider">Dignova-AI</span>
                </div>
                
                <div class="tree-children">
                    <!-- Super Admin Branch -->
                    <div class="tree-node" id="node-admin-parent">
                        <div class="node-label" onclick="jumpTo(1)">
                            <i data-lucide="shield" class="w-4 h-4"></i>
                            <span class="text-xs font-bold uppercase tracking-wider">Super Admin</span>
                        </div>
                        <div class="tree-children">
                            <div class="tree-node">
                                <div class="node-label" onclick="jumpTo(2)">
                                    <i data-lucide="zap" class="w-4 h-4"></i>
                                    <span class="text-xs font-bold uppercase tracking-wider">Features (n8n)</span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Application Branch -->
                    <div class="tree-node" id="node-app-parent">
                        <div class="node-label" onclick="jumpTo(3)">
                            <i data-lucide="layout" class="w-4 h-4"></i>
                            <span class="text-xs font-bold uppercase tracking-wider">Application</span>
                        </div>
                        <div class="tree-children">
                            <!-- Organization Branch -->
                            <div class="tree-node" id="node-org-parent">
                                <div class="node-label" onclick="jumpTo(4)">
                                    <i data-lucide="building-2" class="w-4 h-4"></i>
                                    <span class="text-xs font-bold uppercase tracking-wider">Organization</span>
                                </div>
                                <div class="tree-children">
                                    <div class="tree-node" id="node-doc-parent">
                                        <div class="node-label" onclick="jumpTo(5)">
                                            <i data-lucide="stethoscope" class="w-4 h-4"></i>
                                            <span class="text-xs font-bold uppercase tracking-wider">Doctor</span>
                                        </div>
                                        <div class="tree-children">
                                            <div class="node-label" onclick="jumpTo(6)">
                                                <i data-lucide="file-text" class="w-4 h-4"></i>
                                                <span class="text-xs font-bold uppercase tracking-wider">Details</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="tree-node" id="node-pat-parent">
                                        <div class="node-label" onclick="jumpTo(7)">
                                            <i data-lucide="users" class="w-4 h-4"></i>
                                            <span class="text-xs font-bold uppercase tracking-wider">Patients</span>
                                        </div>
                                        <div class="tree-children">
                                            <div class="node-label" onclick="jumpTo(8)">
                                                <i data-lucide="file-text" class="w-4 h-4"></i>
                                                <span class="text-xs font-bold uppercase tracking-wider">Details</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- User Branch -->
                            <div class="tree-node" id="node-user-parent">
                                <div class="node-label" onclick="jumpTo(9)">
                                    <i data-lucide="user-circle" class="w-4 h-4"></i>
                                    <span class="text-xs font-bold uppercase tracking-wider">User</span>
                                </div>
                                <div class="tree-children">
                                    <div class="node-label" onclick="jumpTo(10)">
                                        <i data-lucide="file-text" class="w-4 h-4"></i>
                                        <span class="text-xs font-bold uppercase tracking-wider">Details</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <div class="p-6 border-t border-white/5 bg-black/20">
            <div class="flex items-center justify-between mb-4">
                <span class="text-[10px] mono text-white/20 uppercase">Intelligence Feed</span>
                <span class="text-[10px] font-bold text-accent">LIVE</span>
            </div>
            <div class="h-1 w-full bg-white/5 rounded-full overflow-hidden">
                <div id="progress" class="progress-bar h-full bg-accent" style="width: 10%"></div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT AREA (NotebookLLM Guide) -->
    <main class="flex-1 relative flex flex-col">
        <!-- Header Controls -->
        <div class="p-8 flex justify-between items-center bg-transparent z-10">
            <div class="flex gap-4">
                <button onclick="prev()" class="w-10 h-10 rounded-full glass-card flex items-center justify-center hover:bg-white/10 transition-all">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                </button>
                <button onclick="next()" class="w-10 h-10 rounded-full glass-card flex items-center justify-center hover:bg-white/10 transition-all text-accent">
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </div>
            <div class="px-6 py-2 rounded-full glass-card">
                <span class="text-[11px] font-bold uppercase tracking-widest text-white/40" id="step-id">Node: Root_Entry</span>
            </div>
        </div>

        <!-- Dynamic Content -->
        <div class="flex-1 flex items-center justify-center px-20">
            <div id="content-viewport" class="max-w-3xl w-full opacity-0 translate-y-4">
                <!-- Content will be injected here -->
            </div>
        </div>

        <!-- Footer Ticker -->
        <div class="p-6 border-t border-white/5 bg-black/40 backdrop-blur-md">
            <div class="overflow-hidden">
                <div class="flex gap-12 whitespace-nowrap opacity-20 text-[9px] mono uppercase tracking-[0.3em]">
                    <span>Neural_Sync_Active</span> <span>Node_Status: Nominal</span> <span>EHR_Link_Established</span> <span>Sentient_OS_v1.0</span> <span>Multi_Tenant_Active</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const nodes = [
            { id: "root", title: "Dignova Sentient Layer", sub: "THE_OS_FOUNDATION", icon: "network", desc: "The core architecture of Dignova-AI. It operates as a sentient foundation that orchestrates healthcare workflows through passive observation and autonomous agency.", parents: [] },
            { id: "admin-parent", title: "Super Admin Control", sub: "ARCHITECT_PLANE", icon: "shield", desc: "The platform-wide control center. Responsible for multi-tenant isolation, global health monitoring, and scaling the neural grid across multiple organizations.", parents: ["node-root"] },
            { id: "features", title: "Intelligent Features (n8n)", sub: "NERVOUS_SYSTEM", icon: "zap", desc: "The 'Nervous System' of Dignova. Powered by n8n, this layer executes autonomous agency—Telegram alerts, zero-touch prescriptions, and geofenced check-ins.", parents: ["node-root", "node-admin-parent"] },
            { id: "app-parent", title: "Application Interface", sub: "INTERACTIVE_SURFACE", icon: "layout", desc: "The primary touchpoint for users. Designed with a Sentient UI philosophy to minimize friction and maximize data clarity through 3D visualization.", parents: ["node-root"] },
            { id: "org-parent", title: "Organization Context", sub: "TENANT_SPACE", icon: "building-2", desc: "A scoped hospital environment. Each organization has its own clinical philosophy, resource management, and departmental orchestration.", parents: ["node-root", "node-app-parent"] },
            { id: "doc-parent", title: "Doctor Command Center", sub: "CLINICAL_CORE", icon: "stethoscope", desc: "A specialized portal for medical staff, focusing on live triage intervention, patient history, and diagnostic alignment scoring.", parents: ["node-root", "node-app-parent", "node-org-parent"] },
            { id: "doc-details", title: "Clinical Metrics", sub: "DOCTOR_DETAILS", icon: "file-text", desc: "Deep-dive data on doctor performance: diagnostic accuracy, patients cleared, and availability readiness within the organization.", parents: ["node-root", "node-app-parent", "node-org-parent", "node-doc-parent"] },
            { id: "pat-parent", title: "Patients Registry", sub: "CARE_QUEUE", icon: "users", desc: "Management of the patient population within the org. Handles check-ins, medical grid assignments, and severity monitoring.", parents: ["node-root", "node-app-parent", "node-org-parent"] },
            { id: "pat-details", title: "Patient Intelligence", sub: "PATIENT_DETAILS", icon: "file-text", desc: "Complete 360-degree patient view: Neural medical timeline, real-time vitals, and proactive health nudge history.", parents: ["node-root", "node-app-parent", "node-org-parent", "node-pat-parent"] },
            { id: "user-parent", title: "User Profile Layer", sub: "PERSONAL_IDENTITY", icon: "user-circle", desc: "The public-facing portal for patients to manage their own health identity, record vitals manually, and view personalized tips.", parents: ["node-root", "node-app-parent"] },
            { id: "user-details", title: "Identity Record", sub: "USER_DETAILS", icon: "file-text", desc: "Personal settings, emergency contacts, and the 'Emotional Telemetry' profile which tracks stress levels via typing cadence.", parents: ["node-root", "node-app-parent", "node-user-parent"] }
        ];

        let currentIdx = 0;

        function render() {
            const node = nodes[currentIdx];
            const viewport = document.getElementById('content-viewport');
            
            // Animation Out
            viewport.classList.remove('animate-content');
            viewport.style.opacity = '0';
            viewport.style.transform = 'translateY(10px)';

            setTimeout(() => {
                viewport.innerHTML = `
                    <div class="flex flex-col gap-8">
                        <div>
                            <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full border border-accent/20 bg-accent/5 text-accent text-[10px] font-black uppercase tracking-[0.2em] mb-6">
                                <i data-lucide="${node.icon}" class="w-3 h-3"></i> ${node.sub}
                            </div>
                            <h2 class="text-6xl font-black text-white tracking-tighter leading-[1.1] mb-8">
                                ${node.title}
                            </h2>
                            <p class="text-xl text-white/50 leading-relaxed font-medium">
                                ${node.desc}
                            </p>
                        </div>

                        <div class="grid grid-cols-2 gap-4 mt-12">
                            <div class="glass-card p-6 rounded-3xl border-white/5 flex flex-col gap-4">
                                <div class="w-10 h-10 rounded-2xl bg-white/5 flex items-center justify-center">
                                    <i data-lucide="shield-check" class="w-5 h-5 text-accent"></i>
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold text-white uppercase tracking-widest">Sentient Sync</h4>
                                    <p class="text-[10px] text-white/30 mt-1 uppercase mono tracking-widest">Security_Protocols_Active</p>
                                </div>
                            </div>
                            <div class="glass-card p-6 rounded-3xl border-white/5 flex flex-col gap-4">
                                <div class="w-10 h-10 rounded-2xl bg-white/5 flex items-center justify-center">
                                    <i data-lucide="cpu" class="w-5 h-5 text-accent"></i>
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold text-white uppercase tracking-widest">Neural Agency</h4>
                                    <p class="text-[10px] text-white/30 mt-1 uppercase mono tracking-widest">Autonomous_Workflows</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                
                // Animation In
                viewport.classList.add('animate-content');
                updateTreeState();
                lucide.createIcons();
            }, 50);
        }

        function updateTreeState() {
            const node = nodes[currentIdx];
            
            // 1. Reset all labels
            document.querySelectorAll('.node-label').forEach(l => l.classList.remove('active'));
            
            // 2. Set current label active
            const labels = document.querySelectorAll('.node-label');
            labels[currentIdx].classList.add('active');

            // 3. Open parents
            document.querySelectorAll('.tree-node').forEach(tn => tn.classList.remove('open'));
            document.getElementById('node-root').classList.add('open');
            
            node.parents.forEach(pId => {
                const el = document.getElementById(pId);
                if (el) el.classList.add('open');
            });

            // 4. Update Header Step ID
            document.getElementById('step-id').innerText = `Node: ${node.sub}`;

            // 5. Update Progress
            const progress = ((currentIdx + 1) / nodes.length) * 100;
            document.getElementById('progress').style.width = `${progress}%`;
        }

        function next() {
            if (currentIdx < nodes.length - 1) {
                currentIdx++;
                render();
            }
        }

        function prev() {
            if (currentIdx > 0) {
                currentIdx--;
                render();
            }
        }

        function jumpTo(idx) {
            currentIdx = idx;
            render();
        }

        // Initialize
        window.onload = () => {
            render();
            lucide.createIcons();
        };

        // Keyboard support
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prev();
        });
    </script>
</body>
</html>
