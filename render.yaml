services:
  # ── Backend (FastAPI) ────────────────────────────────────────────
  - type: web
    name: dignova-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m migrations.migrate_prod
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --timeout 120
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false          # set manually — keep token secret
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: BACKEND_URL
        sync: false          # e.g. https://dignova-ai.onrender.com
      - key: BACKEND_URL_WS
        sync: false          # e.g. wss://dignova-ai.onrender.com
      - key: FRONTEND_URL
        sync: false          # e.g. https://dignova-ai.vercel.app
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: N8N_BASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SIMULATE_EMAIL
        value: "False"
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_USE_TLS
        value: "False"
      - key: MAIL_USE_SSL
        value: "True"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Dignova AI
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: RESEND_API_KEY
        sync: false
      # ── Sentient OS Layer ────────────────────────────────────────────
      - key: OLLAMA_BASE_URL
        value: ""              # leave blank on Render (no local LLM)
      - key: OLLAMA_MODEL
        value: llama3.2

  # ── n8n Automation Engine (Docker) ──────────────────────────────
  - type: web
    name: dignova-n8n
    runtime: docker
    rootDir: n8n
    plan: free
    envVars:
      - key: N8N_ENFORCE_SETTINGS_FILE_FOR_EVAL
        value: "true"
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "true"
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        value: dignova2026admin
      - key: N8N_PORT
        value: "10000"
      - key: DATABASE_URL
        value: postgresql://diagnova_user:xuhhO5iZVWlMeqrrrpJXZv0T81071tKM@dpg-d9680ihkh4rs73dcqlb0-a/diagnova
      - key: RESEND_API_KEY
        sync: false
      - key: EXECUTIONS_PROCESS
        value: main
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "1"
      - key: NODE_OPTIONS
        value: --max-old-space-size=350

  # ── Keep-Alive Cron (prevents free tier sleep) ─────────────────
  - type: cron
    name: dignova-keepalive
    runtime: python
    rootDir: keepalive
    schedule: "*/14 * * * *"
    buildCommand: pip install requests
    startCommand: python ping.py
    plan: free
