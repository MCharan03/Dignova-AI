services:
  # ── Backend (FastAPI) ────────────────────────────────────────────
  - type: web
    name: dignova-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --timeout 120
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: JWT_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false          # set manually — keep token secret
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: BACKEND_URL
        sync: false          # e.g. https://dignova-ai-backend.onrender.com
      - key: BACKEND_URL_WS
        sync: false          # e.g. wss://dignova-ai-backend.onrender.com
      - key: FRONTEND_URL
        sync: false          # e.g. https://dignova-ai.vercel.app
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemini-2.0-flash-001
      - key: N8N_BASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SIMULATE_EMAIL
        value: "False"
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        value: Dignova AI
      - key: PYTHON_VERSION
        value: "3.11.9"

  # ── Frontend (Next.js) ───────────────────────────────────────────
  - type: web
    name: dignova-ai-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    plan: free
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: dignova-ai-backend
          property: host
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: dignova-ai-backend
          property: host
      - key: NODE_VERSION
        value: "20"
